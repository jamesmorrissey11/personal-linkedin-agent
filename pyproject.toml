[project]
name = "personal-linkedin-agent"
version = "0.1.0"
description = "AI-powered LinkedIn invitation and inbox automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "azure-identity",
    "dotenv-azd",
    "langgraph>=1.2.16",
    "langgraph-sdk>=0.4.8",
    "openai>=1.108.1",
    "playwright",
    "pydantic-ai==1.107.6",
    "pydantic-evals",
    "python-dotenv",
    "pyyaml",
    "rich",
]

[project.scripts]
linkedin-agent = "linkedin_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_agent"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.36",
    "pre-commit",
    "pytest",
    "pytest-playwright",
    "ruff",
]

[tool.ruff]
line-length = 1000
target-version = "py310"
src = ["src", "."]
cache-dir = ".cache/ruff"
extend-exclude = ["deploy/agent-inbox"]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["D203"]

[tool.pytest.ini_options]
testpaths = ["tests/playwright", "tests/unit"]
cache_dir = ".cache/pytest"
addopts = "--browser chromium"
