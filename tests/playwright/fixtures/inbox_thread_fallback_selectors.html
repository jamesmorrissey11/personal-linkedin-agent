-->

      <ul>
        <li class="msg-s-message-list__event">
          <a href="/in/sam-colleague"><span class="msg-s-message-group__profile-link">Sam Colleague</span></a>

          <time class="msg-s-message-list__time-heading">Yesterday 4:15 PM</time>

      </ul>
    </main>
